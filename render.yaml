services:
  - type: web
    name: time2work
    runtime: node
    branch: main
    rootDir: t2w
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    numInstances: 1
    disk:
      name: time2work-data
      mountPath: /opt/render/project/src/t2w/.local
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
